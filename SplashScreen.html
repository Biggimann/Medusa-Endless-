<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="5;url=/dashboard">
  <title>Medusa ♾️ AI</title>
  <link rel="icon" href="{{ url_for('static', filename='media/logo.png') }}">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
    video{width:100%;height:100%;object-fit:cover}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.72))}
    .loading{position:absolute;bottom:42px;color:#00ff88;font-size:clamp(1rem,3vw,1.25rem);
      letter-spacing:2px;text-shadow:0 0 12px #00ff88;text-align:center}
  </style>
</head>
<body>
  <video autoplay muted playsinline loop>
    <source src="{{ url_for('static', filename='media/intro.mp4') }}" type="video/mp4">
  </video>
  <div class="shade"></div>
  <div class="loading">Loading Medusa ♾️ AI...</div>
</body>
</html>
